{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0">Change Password</h1>
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('users') }}">Back to Users</a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-3 p-md-4">
                <p class="text-muted small mb-3">
                    Set a new password for <strong>{{ user_target.username }}</strong>.
                </p>

                <form method="post" action="{{ url_for('change_password', user_id=user_target.id) }}" novalidate autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label" for="new_password">New Password</label>
                        <input class="form-control" id="new_password" name="new_password" type="password" minlength="8" required autocomplete="off">
                        <div class="form-text">Minimum length: 8 characters.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="confirm_password">Confirm Password</label>
                        <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="off">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-sm btn-primary">Update Password</button>
                        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('users') }}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
