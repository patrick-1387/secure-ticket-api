{% extends "base.html" %}

{% block content %}
<div class="row g-3">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
            <div>
                <h1 class="h4 mb-1">User Management</h1>
                <p class="text-muted small mb-0">Admin-only user administration.</p>
            </div>
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
        </div>
    </div>

    <div class="col-12 col-lg-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-3">
                <h2 class="h6 mb-3">Create User</h2>
                <form method="post" action="{{ url_for('users') }}" novalidate autocomplete="off">
                    <div class="mb-2">
                        <label class="form-label small" for="username">Username</label>
                        <input class="form-control form-control-sm" id="username" name="username" required autocomplete="off">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" for="password">Password</label>
                        <input class="form-control form-control-sm" id="password" name="password" type="password" required autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small" for="role">Role</label>
                        <select class="form-select form-select-sm" id="role" name="role" required>
                            {% for role in role_options %}
                                <option value="{{ role }}">{{ role }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-sm btn-primary">Create User</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-12 col-lg-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-3">
                <h2 class="h6 mb-3">All Users</h2>
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Role</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for user in users %}
                                <tr>
                                    <td>{{ user.username }}</td>
                                    <td><span class="badge bg-light text-dark border">{{ user.role }}</span></td>
                                    <td class="text-end">
                                        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('edit_user', user_id=user.id) }}">Edit</a>
                                        <a class="btn btn-sm btn-outline-warning" href="{{ url_for('change_password', user_id=user.id) }}">Change Password</a>
                                        <form method="post" action="{{ url_for('delete_user', user_id=user.id) }}" class="d-inline" onsubmit="return confirm('Delete this user?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" {% if user.id == current_user.id %}disabled{% endif %}>Delete</button>
                                        </form>
                                    </td>
                                </tr>
                            {% else %}
                                <tr>
                                    <td colspan="3" class="text-center text-muted py-3">No users found.</td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
