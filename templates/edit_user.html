{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0">Edit User</h1>
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('users') }}">Back to Users</a>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-3 p-md-4">
                <form method="post" action="{{ url_for('edit_user', user_id=edit_target.id) }}" novalidate autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-control" id="username" name="username" required value="{{ edit_target.username }}" autocomplete="off">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="role">Role</label>
                        <select class="form-select" id="role" name="role" required>
                            {% for role in role_options %}
                                <option value="{{ role }}" {% if edit_target.role == role %}selected{% endif %}>{{ role }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-sm btn-primary">Save Changes</button>
                        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('users') }}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
